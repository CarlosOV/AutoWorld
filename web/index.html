<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 AutoWorld</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header>
  <span style="font-size:1.8rem;filter:drop-shadow(0 0 8px #c9a84c88)">🌍</span>
  <h1 id="world-title">AutoWorld</h1>
  <span class="badge era" id="era-badge">Loading...</span>
  <span class="badge year" id="year-badge">Year 1</span>
  <div class="stat-row">
    <div class="hstat"><div class="v" id="h-agents">-</div><div class="l">Souls</div></div>
    <div class="hstat"><div class="v" id="h-civs">-</div><div class="l">Civs</div></div>
    <div class="hstat"><div class="v" id="h-wars" style="color:var(--red2)">-</div><div class="l">Wars</div></div>
    <div class="hstat"><div class="v" id="h-events">-</div><div class="l">Events</div></div>
    <span class="badge live">● LIVE</span>
  </div>
</header>

<div class="layout">
  <div class="main">
    <canvas id="worldCanvas"></canvas>
    <div class="map-overlay">
      <div class="era-overlay" id="era-overlay">The Primordial Age</div>
      <div class="event-ticker"><span id="ticker-text">The world stirs in silence...</span></div>
    </div>
  </div>

  <div class="side">
    <!-- Oracle always visible at top -->
    <div class="oracle-box">
      <h3>🔮 The Oracle</h3>
      <input class="oracle-input" id="oracle-input" placeholder="Ask the world..." onkeydown="if(event.key==='Enter')askOracle(false)">
      <div class="oracle-btns">
        <button onclick="askOracle(false)">⚡ Ask</button>
        <button class="deep-btn" onclick="askOracle(true)">🔍 Deep Search</button>
      </div>
      <div class="oracle-response" id="oracle-response">The oracle awaits your question, traveler...</div>
    </div>

    <!-- Tabs -->
    <div class="side-tabs">
      <button class="side-tab active" onclick="switchTab('chronicle')">Chronicle</button>
      <button class="side-tab" onclick="switchTab('agents')">Souls</button>
      <button class="side-tab" onclick="switchTab('civs')">Empires</button>
      <button class="side-tab" onclick="switchTab('economy')">Economy</button>
    </div>

    <div id="tab-chronicle" class="tab-content active">
      <div class="chronicle-filters">
        <input id="search-events" placeholder="search..." oninput="searchEvents(this.value)">
        <select id="filter-type" onchange="searchEvents(document.getElementById('search-events').value)">
          <option value="notable">notable</option>
          <option value="">all</option>
          <option value="world_event">world</option>
          <option value="war">⚔️ war</option>
          <option value="gossip">🗣️ gossip</option>
          <option value="discovery">🔬 discovery</option>
          <option value="personal_story">📖 stories</option>
          <option value="birth">👶 births</option>
          <option value="era_change">🌅 eras</option>
          <option value="agent_reaction">reactions</option>
        </select>
      </div>
      <div id="event-list"></div>
      <button class="load-more" id="load-more-btn" onclick="loadMoreEvents()">Load More Chronicles</button>
    </div>

    <div id="tab-agents" class="tab-content">
      <div id="agents-list"></div>
    </div>

    <div id="tab-civs" class="tab-content">
      <div id="civs-list"></div>
    </div>
    <div id="tab-economy" class="tab-content">
      <div id="economy-list"></div>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
